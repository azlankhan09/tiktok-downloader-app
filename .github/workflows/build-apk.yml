name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip Flutter project
        run: |
          mkdir -p flutter-app
          unzip -q tiktok-downloader-app.zip -d flutter-app
          chmod +x flutter-app/android/gradlew
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: cd flutter-app && flutter pub get
      - name: Build debug APK
        run: cd flutter-app && flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-downloader-debug-apk
          path: flutter-app/build/app/outputs/flutter-apk/app-debug.apk
      - name: Build release APK
        run: cd flutter-app && flutter build apk --release
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-downloader-release-apk
          path: flutter-app/build/app/outputs/flutter-apk/app-release.apk
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: flutter-app/build/app/outputs/flutter-apk/app-release.apk
